

server.port=8080

# =========================================================
# DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/fixora?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=varsha0108@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# JWT SECRET
# =========================================================

app.jwt.secret=campusfixSecretKeyForJwtAuthenticationWhichShouldBeLongEnoughToMeetRequirements
app.jwt.expiration-ms=86400000
app.jwt.expiration=86400000

# =========================================================
# FILE UPLOAD SETTINGS
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================
# FILE STORAGE
# =========================================================

app.upload.dir=uploads/complaints

# =========================================================
# MAIL CONFIGURATION
# =========================================================

app.mail.enabled=false
app.email.enabled=false

